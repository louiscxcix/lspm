name: Configure shared production database
on:
  workflow_dispatch:
    inputs:
      scram_verifier:
        description: SCRAM verifier for the new scoped production login, never a raw password
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-database-connection
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - run: node integration/provision-production.cjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PASSWORD_VERIFIER: ${{ inputs.scram_verifier }}
