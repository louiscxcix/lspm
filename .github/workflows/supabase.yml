name: Test and deploy Supabase app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2
          cache: npm
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test-bootstrap.sql -f supabase/migrations/202610160001_ontology.sql
      - run: npm test
      - run: npm run build:supabase && npm run build:cloud

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.2
          cache: npm
      - run: npm ci
      - run: npm run build:supabase
      - run: node scripts/deploy-supabase.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npm run build:cloud
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-build
      - uses: actions/deploy-pages@v4
        id: pages
